
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BULKA INTELLIGENCE — AI Chat</title>
<meta name="description" content="Персональное AI-пространство BULKA INTELLIGENCE.">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg: #0b0b12;
    --panel: #11111b;
    --panel-hover: #1b1a29;
    --purple: #8b5cf6;
    --purple-light: #a78bfa;
    --text: #f5f3ff;
    --muted: #9290a5;
    --border: rgba(255,255,255,.075);
}

body {
    height: 100vh;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, sans-serif;
}

/* ОСНОВНОЙ МАКЕТ */

.app {
    display: flex;
    height: 100vh;
    width: 100%;
}

/* ЦЕНТРАЛЬНЫЙ ЧАТ */

.main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    position: relative;
}

.topbar {
    height: 65px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 27px;
    border-bottom: 1px solid var(--border);
}

.topbar-left {
    display: flex;
    align-items: center;
    gap: 13px;
}

.brand {
    font-weight: 800;
    letter-spacing: .8px;
    font-size: 16px;
}

.brand span {
    color: var(--purple-light);
}

.model-name {
    color: var(--muted);
    font-size: 13px;
    padding-left: 12px;
    border-left: 1px solid var(--border);
}

.online {
    color: #a78bfa;
    font-size: 11px;
    background: rgba(139,92,246,.12);
    padding: 8px 12px;
    border-radius: 20px;
}

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 35px 22px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 25px;
    scroll-behavior: smooth;
}

.welcome {
    margin: auto 0;
    text-align: center;
    max-width: 650px;
    padding: 20px;
}

.welcome-logo {
    width: 68px;
    height: 68px;
    margin: 0 auto 24px;
    display: grid;
    place-items: center;
    border-radius: 22px;
    font-size: 30px;
    background: linear-gradient(135deg,#9b6cff,#5425a9);
    box-shadow: 0 0 55px rgba(139,92,246,.25);
}

.welcome h1 {
    font-size: 32px;
    margin-bottom: 13px;
}

.welcome h1 span {
    color: var(--purple-light);
}

.welcome p {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.7;
}

.message {
    width: 100%;
    max-width: 820px;
    display: flex;
    gap: 13px;
    animation: appear .2s ease;
}

@keyframes appear {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
}

.avatar {
    width: 34px;
    height: 34px;
    flex-shrink: 0;
    display: grid;
    place-items: center;
    border-radius: 11px;
    font-size: 13px;
    font-weight: bold;
}

.assistant .avatar {
    background: linear-gradient(135deg,#9b6cff,#5425a9);
}

.user .avatar {
    background: #29283b;
}

.message-body {
    flex: 1;
    min-width: 0;
    padding-top: 5px;
}

.message-name {
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 9px;
}

.message-text {
    font-size: 14px;
    line-height: 1.8;
    color: #dedbea;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

/* ПОЛЕ ВВОДА */

.composer-area {
    width: 100%;
    padding: 15px 20px 25px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.composer {
    width: 100%;
    max-width: 820px;
    background: #191824;
    border: 1px solid rgba(167,139,250,.2);
    border-radius: 18px;
    padding: 11px 12px 11px 18px;
    display: flex;
    align-items: flex-end;
    gap: 12px;
    transition: .2s;
}

.composer:focus-within {
    border-color: var(--purple);
    box-shadow: 0 0 20px rgba(139,92,246,.1);
}

textarea {
    flex: 1;
    min-width: 0;
    resize: none;
    border: none;
    outline: none;
    background: transparent;
    color: white;
    font-family: Arial,sans-serif;
    font-size: 14px;
    padding: 10px 0;
    min-height: 42px;
    max-height: 150px;
}

textarea::placeholder {
    color: #77758b;
}

.send {
    width: 43px;
    height: 43px;
    flex-shrink: 0;
    border: none;
    border-radius: 12px;
    background: var(--purple);
    color: white;
    font-size: 21px;
    cursor: pointer;
    transition: .2s;
}

.send:hover {
    background: #a78bfa;
}

.send:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.disclaimer {
    margin-top: 11px;
    font-size: 11px;
    color: #69677a;
    text-align: center;
}

/* ПРАВАЯ ПАНЕЛЬ */

.sidebar {
    width: 285px;
    flex-shrink: 0;
    background: #101019;
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 20px 14px;
    overflow-y: auto;
}

.sidebar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 8px;
    margin-bottom: 22px;
}

.sidebar-logo {
    font-size: 17px;
    font-weight: 800;
    letter-spacing: .5px;
}

.sidebar-logo span {
    color: var(--purple-light);
}

.collapse {
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 20px;
    cursor: pointer;
}

.new-chat {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 13px 14px;
    border: 1px solid rgba(167,139,250,.25);
    border-radius: 12px;
    background: rgba(139,92,246,.13);
    color: white;
    font-size: 13px;
    cursor: pointer;
    transition: .2s;
    margin-bottom: 23px;
    text-align: left;
}

.new-chat:hover {
    background: rgba(139,92,246,.24);
}

.new-chat span {
    font-size: 20px;
}

.section-label {
    color: #77758b;
    font-size: 10px;
    font-weight: bold;
    letter-spacing: 1.2px;
    padding: 0 10px;
    margin: 12px 0 9px;
    text-transform: uppercase;
}

.nav-item {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 12px;
    background: transparent;
    border: none;
    border-radius: 10px;
    color: #c4c1d0;
    font-size: 13px;
    text-align: left;
    cursor: pointer;
    transition: .18s;
    margin-bottom: 3px;
}

.nav-item:hover {
    background: var(--panel-hover);
    color: white;
}

.nav-item.active {
    background: rgba(139,92,246,.16);
    color: var(--purple-light);
}

.nav-icon {
    width: 19px;
    text-align: center;
    font-size: 16px;
}

.recent-list {
    display: flex;
    flex-direction: column;
    gap: 3px;
}

.recent-item {
    display: flex;
    align-items: center;
    gap: 5px;
    border-radius: 9px;
    padding: 9px 7px 9px 12px;
    color: #aaa7b9;
    font-size: 12px;
    cursor: pointer;
    transition: .18s;
}

.recent-item:hover {
    background: var(--panel-hover);
    color: white;
}

.recent-item.active {
    background: #1c1a2b;
    color: white;
}

.recent-title {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.recent-delete {
    opacity: 0;
    border: none;
    background: transparent;
    color: #9994aa;
    cursor: pointer;
    padding: 4px;
    font-size: 15px;
}

.recent-item:hover .recent-delete {
    opacity: 1;
}

.empty-history {
    color: #77758b;
    font-size: 12px;
    padding: 8px 12px;
}

.sidebar-bottom {
    margin-top: auto;
    padding-top: 20px;
    border-top: 1px solid var(--border);
}

.home-link {
    display: flex;
    align-items: center;
    gap: 11px;
    text-decoration: none;
    color: #aaa7b9;
    font-size: 13px;
    padding: 12px;
    border-radius: 10px;
}

.home-link:hover {
    background: var(--panel-hover);
    color: white;
}

/* СКРЫВАЕМАЯ ПАНЕЛЬ */

.app.sidebar-hidden .sidebar {
    display: none;
}

/* УВЕДОМЛЕНИЯ */

.notice {
    width: 100%;
    max-width: 820px;
    padding: 13px 15px;
    border: 1px solid rgba(167,139,250,.18);
    background: rgba(139,92,246,.08);
    border-radius: 12px;
    color: #c8b9f8;
    font-size: 13px;
    line-height: 1.5;
}

/* МОБИЛЬНАЯ ВЕРСИЯ */

@media(max-width:750px) {
    .sidebar {
        width: 245px;
        position: fixed;
        right: 0;
        top: 0;
        bottom: 0;
        z-index: 10;
        box-shadow: -15px 0 50px rgba(0,0,0,.4);
    }

    .app.sidebar-hidden .sidebar {
        display: none;
    }

    .topbar {
        padding: 0 14px;
    }

    .messages {
        padding: 25px 13px;
    }

    .composer-area {
        padding: 10px 12px 17px;
    }

    .welcome h1 {
        font-size: 26px;
    }

    .model-name {
        display: none;
    }
}
</style>
</head>

<body>

<div class="app" id="app">

    <main class="main">

        <header class="topbar">
            <div class="topbar-left">
                <div class="brand">BULKA <span>INTELLIGENCE</span></div>
                <div class="model-name">AI Chat</div>
            </div>

            <div class="online">● AI ONLINE</div>
        </header>

        <section class="messages" id="messages">

            <div class="welcome" id="welcome">
                <div class="welcome-logo">✦</div>
                <h1>Чем займёмся <span>сегодня?</span></h1>
                <p>
                    Добро пожаловать в BULKA INTELLIGENCE.<br>
                    Задавай вопросы, изучай новое и создавай идеи.
                </p>
            </div>

        </section>

        <div class="composer-area">
            <div class="composer">
                <textarea
                    id="question"
                    placeholder="Спроси что-нибудь..."
                    rows="1"
                ></textarea>

                <button class="send" id="sendButton" onclick="sendMessage()">↑</button>
            </div>

            <div class="disclaimer">
                BULKA AI может допускать ошибки. Проверяй важную информацию.
            </div>
        </div>

    </main>

    <aside class="sidebar">

        <div class="sidebar-header">
            <div class="sidebar-logo">BULKA <span>AI</span></div>
            <button class="collapse" onclick="toggleSidebar()" title="Скрыть панель">›</button>
        </div>

        <button class="new-chat" onclick="newChat()">
            <span>＋</span> Новый чат
        </button>

        <div class="section-label">Рабочее пространство</div>

        <button class="nav-item active" data-section="chat" onclick="openSection('chat',this)">
            <span class="nav-icon">◷</span> Чат
        </button>

        <button class="nav-item" data-section="projects" onclick="openSection('projects',this)">
            <span class="nav-icon">▣</span> Проекты
        </button>

        <button class="nav-item" data-section="images" onclick="openSection('images',this)">
            <span class="nav-icon">▧</span> Изображения
        </button>

        <button class="nav-item" data-section="scheduled" onclick="openSection('scheduled',this)">
            <span class="nav-icon">◷</span> Запланировано
        </button>

        <div class="section-label">Твоя библиотека</div>

        <button class="nav-item" data-section="library" onclick="openSection('library',this)">
            <span class="nav-icon">▤</span> Библиотека
        </button>

        <button class="nav-item" data-section="plugins" onclick="openSection('plugins',this)">
            <span class="nav-icon">⌘</span> Плагины
        </button>

        <button class="nav-item" data-section="explore" onclick="openSection('explore',this)">
            <span class="nav-icon">◉</span> Обзор
        </button>

        <div class="section-label">Недавние чаты</div>

        <div class="recent-list" id="recentList"></div>

        <div class="sidebar-bottom">
            <a href="./" class="home-link">
                <span>←</span> На главную
            </a>
        </div>

    </aside>

</div>

<script>
const WORKER_URL = "https://tiny-cloud-6da5.brightflash2211.workers.dev/";
const STORAGE_KEY = "bulka_ai_workspace_v2";

let chats = [];
let activeChatId = null;
let isSending = false;

const app = document.getElementById("app");
const messagesElement = document.getElementById("messages");
const input = document.getElementById("question");
const sendButton = document.getElementById("sendButton");
const recentList = document.getElementById("recentList");

const sectionInfo = {
    projects: {
        title: "Проекты",
        description: "Здесь будут твои отдельные рабочие пространства и тематические проекты."
    },
    images: {
        title: "Изображения",
        description: "Здесь появится создание изображений с помощью искусственного интеллекта."
    },
    scheduled: {
        title: "Запланировано",
        description: "Здесь будут отображаться запланированные задачи и напоминания."
    },
    library: {
        title: "Библиотека",
        description: "Здесь будут храниться сохранённые материалы и файлы."
    },
    plugins: {
        title: "Плагины",
        description: "Здесь появится каталог дополнительных возможностей BULKA AI."
    },
    explore: {
        title: "Обзор",
        description: "Исследуй возможности и новые функции BULKA INTELLIGENCE."
    }
};

function createId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2,8);
}

function saveData() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
            chats,
            activeChatId
        }));
    } catch(error) {
        console.error("Ошибка сохранения:", error);
    }
}

function getActiveChat() {
    return chats.find(chat => chat.id === activeChatId);
}

function newChat() {
    if(isSending) return;

    const chat = {
        id: createId(),
        title: "Новый чат",
        messages: [],
        createdAt: Date.now()
    };

    chats.unshift(chat);
    activeChatId = chat.id;

    saveData();
    renderSidebar();
    renderChat();
    setActiveSection("chat");

    input.focus();
}

function selectChat(id) {
    if(isSending) return;

    activeChatId = id;
    saveData();
    renderSidebar();
    renderChat();
    setActiveSection("chat");
}

function deleteChat(id, event) {
    event.stopPropagation();

    if(isSending && activeChatId === id) return;

    chats = chats.filter(chat => chat.id !== id);

    if(activeChatId === id) {
        activeChatId = chats.length ? chats[0].id : null;
    }

    saveData();
    renderSidebar();
    renderChat();
}

function renameChat(id, event) {
    event.stopPropagation();

    const chat = chats.find(item => item.id === id);
    if(!chat) return;

    const newTitle = prompt("Новое название чата:", chat.title);

    if(newTitle && newTitle.trim()) {
        chat.title = newTitle.trim().slice(0,60);
        saveData();
        renderSidebar();
    }
}

function renderSidebar() {
    recentList.innerHTML = "";

    if(chats.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-history";
        empty.textContent = "Пока нет переписок";
        recentList.appendChild(empty);
        return;
    }

    chats.slice(0,30).forEach(chat => {
        const item = document.createElement("div");
        item.className = "recent-item" +
            (chat.id === activeChatId ? " active" : "");

        item.onclick = () => selectChat(chat.id);
        item.title = chat.title;

        const title = document.createElement("span");
        title.className = "recent-title";
        title.textContent = chat.title;

        const rename = document.createElement("button");
        rename.className = "recent-delete";
        rename.textContent = "✎";
        rename.title = "Переименовать";
        rename.onclick = event => renameChat(chat.id,event);

        const remove = document.createElement("button");
        remove.className = "recent-delete";
        remove.textContent = "×";
        remove.title = "Удалить чат";
        remove.onclick = event => deleteChat(chat.id,event);

        item.appendChild(title);
        item.appendChild(rename);
        item.appendChild(remove);

        recentList.appendChild(item);
    });
}

function renderWelcome() {
    const welcome = document.createElement("div");
    welcome.className = "welcome";
    welcome.id = "welcome";

    const logo = document.createElement("div");
    logo.className = "welcome-logo";
    logo.textContent = "✦";

    const heading = document.createElement("h1");
    heading.append("Чем займёмся ");
    const accent = document.createElement("span");
    accent.textContent = "сегодня?";
    heading.appendChild(accent);

    const description = document.createElement("p");
    description.textContent =
        "Добро пожаловать в BULKA INTELLIGENCE.\nЗадавай вопросы, изучай новое и создавай идеи.";

    welcome.appendChild(logo);
    welcome.appendChild(heading);
    welcome.appendChild(description);

    messagesElement.appendChild(welcome);
}

function addMessage(role, content) {
    const message = document.createElement("div");
    message.className = "message " + role;

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = role === "user" ? "Я" : "B";

    const body = document.createElement("div");
    body.className = "message-body";

    const name = document.createElement("div");
    name.className = "message-name";
    name.textContent = role === "user" ? "Ты" : "BULKA AI";

    const text = document.createElement("div");
    text.className = "message-text";
    text.textContent = content;

    body.appendChild(name);
    body.appendChild(text);

    message.appendChild(avatar);
    message.appendChild(body);

    messagesElement.appendChild(message);
    messagesElement.scrollTop = messagesElement.scrollHeight;
}

function renderChat() {
    messagesElement.innerHTML = "";

    const chat = getActiveChat();

    if(!chat || chat.messages.length === 0) {
        renderWelcome();
        return;
    }

    chat.messages.forEach(message => {
        addMessage(message.role, message.content);
    });
}

function setActiveSection(section) {
    document.querySelectorAll(".nav-item").forEach(item => {
        item.classList.toggle(
            "active",
            item.dataset.section === section
        );
    });
}

function openSection(section, button) {
    if(section === "chat") {
        renderChat();
        setActiveSection("chat");
        return;
    }

    const info = sectionInfo[section];
    if(!info) return;

    setActiveSection(section);
    messagesElement.innerHTML = "";

    const welcome = document.createElement("div");
    welcome.className = "welcome";

    const logo = document.createElement("div");
    logo.className = "welcome-logo";
    logo.textContent = "✦";

    const heading = document.createElement("h1");
    heading.textContent = info.title;

    const description = document.createElement("p");
    description.textContent = info.description;

    welcome.appendChild(logo);
    welcome.appendChild(heading);
    welcome.appendChild(description);

    messagesElement.appendChild(welcome);
}

function toggleSidebar() {
    app.classList.toggle("sidebar-hidden");
}

function showTyping() {
    const message = document.createElement("div");
    message.className = "message assistant";
    message.id = "typing";

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = "B";

    const body = document.createElement("div");
    body.className = "message-body";

    const text = document.createElement("div");
    text.className = "message-text";
    text.style.color = "#a78bfa";
    text.textContent = "BULKA AI думает...";

    body.appendChild(text);
    message.appendChild(avatar);
    message.appendChild(body);

    messagesElement.appendChild(message);
    messagesElement.scrollTop = messagesElement.scrollHeight;
}

function removeTyping() {
    const typing = document.getElementById("typing");
    if(typing) typing.remove();
}

async function sendMessage() {
    const question = input.value.trim();

    if(!question || isSending) return;

    let chat = getActiveChat();

    if(!chat) {
        newChat();
        chat = getActiveChat();
    }

    if(!chat) return;

    setActiveSection("chat");
    isSending = true;
    sendButton.disabled = true;

    input.value = "";
    input.style.height = "42px";

    chat.messages.push({
        role: "user",
        content: question
    });

    if(chat.title === "Новый чат") {
        chat.title = question.slice(0,35) +
            (question.length > 35 ? "..." : "");
    }

    saveData();
    renderSidebar();

    addMessage("user",question);
    showTyping();

    try {
        const response = await fetch(WORKER_URL,{
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                messages: chat.messages.slice(-6)
            })
        });

        const data = await response.json();

        if(!response.ok) {
            throw new Error(data.error || "Ошибка сервера");
        }

        const reply = data.reply || data.text || data.response;

        if(!reply) {
            throw new Error("Сервер не вернул ответ");
        }

        removeTyping();

        chat.messages.push({
            role: "assistant",
            content: reply
        });

        saveData();
        addMessage("assistant",reply);

    } catch(error) {
        removeTyping();

        addMessage(
            "assistant",
            "Не удалось получить ответ: " + error.message
        );

        console.error(error);

    } finally {
        isSending = false;
        sendButton.disabled = false;
        input.focus();
    }
}

function restoreData() {
    try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));

        if(saved && Array.isArray(saved.chats)) {
            chats = saved.chats.filter(chat =>
                chat &&
                typeof chat.id === "string" &&
                Array.isArray(chat.messages)
            );

            activeChatId = saved.activeChatId;
        }
    } catch(error) {
        console.error("Ошибка восстановления:",error);
    }

    if(!chats.some(chat => chat.id === activeChatId)) {
        activeChatId = chats.length ? chats[0].id : null;
    }

    renderSidebar();
    renderChat();
}

input.addEventListener("input",() => {
    input.style.height = "42px";
    input.style.height = Math.min(input.scrollHeight,150) + "px";
});

input.addEventListener("keydown",event => {
    if(event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
    }
});

restoreData();
</script>

</body>
</html>
