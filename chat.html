
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI CHAT — BULKA INTELLIGENCE</title>
<meta name="description" content="Общайся с искусственным интеллектом BULKA INTELLIGENCE.">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg: #09090f;
    --panel: #11111b;
    --panel2: #171725;
    --purple: #8b5cf6;
    --purple2: #a78bfa;
    --text: #f5f3ff;
    --muted: #9290a5;
    --border: rgba(255,255,255,.08);
}

body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, sans-serif;
    display: flex;
}

.sidebar {
    width: 260px;
    background: #0e0e17;
    border-right: 1px solid var(--border);
    padding: 24px 18px;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
}

.logo {
    font-size: 21px;
    font-weight: 800;
    letter-spacing: 1px;
    margin-bottom: 35px;
}

.logo span {
    color: var(--purple2);
}

.new-chat {
    width: 100%;
    padding: 14px;
    border: 1px solid rgba(167,139,250,.3);
    border-radius: 12px;
    background: rgba(139,92,246,.12);
    color: white;
    cursor: pointer;
    font-size: 14px;
    transition: .2s;
}

.new-chat:hover {
    background: rgba(139,92,246,.25);
}

.sidebar-bottom {
    margin-top: auto;
}

.back-link {
    display: block;
    color: var(--muted);
    text-decoration: none;
    padding: 13px 10px;
    border-radius: 10px;
    font-size: 14px;
}

.back-link:hover {
    background: var(--panel2);
    color: white;
}

.main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    height: 100vh;
}

.topbar {
    height: 70px;
    padding: 0 30px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
}

.topbar-title {
    font-size: 17px;
    font-weight: 700;
}

.status {
    color: #a78bfa;
    font-size: 12px;
    background: rgba(139,92,246,.12);
    padding: 8px 12px;
    border-radius: 20px;
}

.chat {
    flex: 1;
    overflow-y: auto;
    padding: 35px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
}

.welcome {
    text-align: center;
    margin: auto 0;
    max-width: 600px;
}

.welcome-icon {
    width: 65px;
    height: 65px;
    border-radius: 20px;
    background: linear-gradient(135deg,#8b5cf6,#5b21b6);
    display: grid;
    place-items: center;
    margin: 0 auto 22px;
    font-size: 28px;
    box-shadow: 0 0 45px rgba(139,92,246,.25);
}

.welcome h1 {
    font-size: 32px;
    margin-bottom: 12px;
}

.welcome h1 span {
    color: var(--purple2);
}

.welcome p {
    color: var(--muted);
    line-height: 1.6;
    font-size: 14px;
}

.message {
    width: 100%;
    max-width: 850px;
    display: flex;
    gap: 13px;
    align-items: flex-start;
    animation: appear .2s ease;
}

@keyframes appear {
    from { opacity: 0; transform: translateY(7px); }
    to { opacity: 1; transform: translateY(0); }
}

.avatar {
    width: 35px;
    height: 35px;
    flex-shrink: 0;
    border-radius: 11px;
    display: grid;
    place-items: center;
    font-size: 13px;
    font-weight: bold;
}

.assistant .avatar {
    background: linear-gradient(135deg,#8b5cf6,#5b21b6);
}

.user .avatar {
    background: #29283b;
}

.message-content {
    flex: 1;
    min-width: 0;
    padding-top: 5px;
}

.message-name {
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 8px;
}

.message-text {
    font-size: 14px;
    line-height: 1.75;
    color: #dedbea;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.composer-area {
    padding: 15px 20px 25px;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.composer {
    width: 100%;
    max-width: 850px;
    background: var(--panel2);
    border: 1px solid rgba(167,139,250,.2);
    border-radius: 17px;
    padding: 10px 12px 10px 17px;
    display: flex;
    align-items: flex-end;
    gap: 12px;
    transition: .2s;
}

.composer:focus-within {
    border-color: var(--purple);
    box-shadow: 0 0 20px rgba(139,92,246,.1);
}

textarea {
    flex: 1;
    resize: none;
    border: none;
    outline: none;
    background: transparent;
    color: white;
    font-family: Arial,sans-serif;
    font-size: 14px;
    padding: 10px 0;
    min-height: 42px;
    max-height: 150px;
}

textarea::placeholder {
    color: #77758b;
}

.send {
    width: 43px;
    height: 43px;
    flex-shrink: 0;
    border: none;
    border-radius: 12px;
    background: var(--purple);
    color: white;
    font-size: 19px;
    cursor: pointer;
    transition: .2s;
}

.send:hover {
    background: #a78bfa;
}

.send:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.disclaimer {
    margin-top: 12px;
    color: #666477;
    font-size: 11px;
    text-align: center;
}

.typing {
    color: var(--purple2);
    font-size: 13px;
}

@media(max-width:700px) {
    .sidebar {
        width: 65px;
        padding: 18px 8px;
        align-items: center;
    }

    .logo {
        font-size: 0;
        margin-bottom: 25px;
    }

    .logo::after {
        content: "B";
        font-size: 23px;
        color: var(--purple2);
    }

    .new-chat {
        font-size: 0;
        padding: 12px 5px;
    }

    .new-chat::after {
        content: "+";
        font-size: 22px;
    }

    .back-link {
        font-size: 0;
    }

    .back-link::after {
        content: "←";
        font-size: 22px;
    }

    .topbar {
        padding: 0 15px;
    }

    .chat {
        padding: 25px 13px;
    }

    .welcome h1 {
        font-size: 26px;
    }

    .composer-area {
        padding: 10px 12px 18px;
    }
}
</style>
</head>

<body>

<aside class="sidebar">
    <div class="logo">BULKA <span>INTELLIGENCE</span></div>

    <button class="new-chat" onclick="newChat()">＋ Новый чат</button>

    <div class="sidebar-bottom">
        <a href="./" class="back-link">← На главную</a>
    </div>
</aside>

<main class="main">

    <header class="topbar">
        <div class="topbar-title">AI CHAT</div>
        <div class="status">● AI ONLINE</div>
    </header>

    <section class="chat" id="messages">

        <div class="welcome" id="welcome">
            <div class="welcome-icon">✦</div>
            <h1>Привет, это <span>BULKA AI</span></h1>
            <p>
                Твой персональный искусственный интеллект.<br>
                Задавай вопросы, учись, создавай и исследуй новое.
            </p>
        </div>

    </section>

    <div class="composer-area">

        <div class="composer">
            <textarea
                id="question"
                placeholder="Напиши сообщение..."
                rows="1"
            ></textarea>

            <button class="send" id="sendButton" onclick="sendMessage()">↑</button>
        </div>

        <div class="disclaimer">
            BULKA INTELLIGENCE может допускать ошибки. Проверяй важную информацию.
        </div>

    </div>

</main>

<script>
const WORKER_URL = "https://tiny-cloud-6da5.brightflash2211.workers.dev/";
const STORAGE_KEY = "bulka_intelligence_separate_chat_v1";

let conversation = [];
let isSending = false;

const messagesElement = document.getElementById("messages");
const input = document.getElementById("question");
const sendButton = document.getElementById("sendButton");
const welcome = document.getElementById("welcome");

function saveConversation() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(conversation));
    } catch (error) {
        console.error("Ошибка сохранения:", error);
    }
}

function hideWelcome() {
    if (welcome) {
        welcome.style.display = "none";
    }
}

function addMessage(role, content) {
    hideWelcome();

    const message = document.createElement("div");
    message.className = "message " + (role === "user" ? "user" : "assistant");

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = role === "user" ? "Я" : "B";

    const contentBox = document.createElement("div");
    contentBox.className = "message-content";

    const name = document.createElement("div");
    name.className = "message-name";
    name.textContent = role === "user" ? "Ты" : "BULKA AI";

    const text = document.createElement("div");
    text.className = "message-text";
    text.textContent = content;

    contentBox.appendChild(name);
    contentBox.appendChild(text);

    message.appendChild(avatar);
    message.appendChild(contentBox);

    messagesElement.appendChild(message);
    messagesElement.scrollTop = messagesElement.scrollHeight;

    return message;
}

function showTyping() {
    const message = document.createElement("div");
    message.className = "message assistant";
    message.id = "typing";

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = "B";

    const text = document.createElement("div");
    text.className = "message-content typing";
    text.textContent = "BULKA AI думает...";

    message.appendChild(avatar);
    message.appendChild(text);

    messagesElement.appendChild(message);
    messagesElement.scrollTop = messagesElement.scrollHeight;
}

function removeTyping() {
    const typing = document.getElementById("typing");
    if (typing) typing.remove();
}

async function sendMessage() {
    const question = input.value.trim();

    if (!question || isSending) return;

    isSending = true;
    sendButton.disabled = true;

    input.value = "";
    input.style.height = "42px";

    conversation.push({
        role: "user",
        content: question
    });

    addMessage("user", question);
    saveConversation();

    showTyping();

    try {
        const response = await fetch(WORKER_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                messages: conversation.slice(-6)
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Ошибка сервера");
        }

        const reply = data.reply || data.text || data.response;

        if (!reply) {
            throw new Error("Сервер не вернул ответ");
        }

        removeTyping();

        conversation.push({
            role: "assistant",
            content: reply
        });

        addMessage("assistant", reply);
        saveConversation();

    } catch (error) {
        removeTyping();

        addMessage(
            "assistant",
            "Не удалось получить ответ: " + error.message
        );

        console.error(error);

    } finally {
        isSending = false;
        sendButton.disabled = false;
        input.focus();
    }
}

function newChat() {
    if (isSending) return;

    conversation = [];
    localStorage.removeItem(STORAGE_KEY);

    messagesElement.innerHTML = "";
    messagesElement.appendChild(welcome);
    welcome.style.display = "block";
}

function restoreChat() {
    try {
        const saved = localStorage.getItem(STORAGE_KEY);

        if (!saved) return;

        const parsed = JSON.parse(saved);

        if (!Array.isArray(parsed)) return;

        conversation = parsed.filter(item =>
            item &&
            (item.role === "user" || item.role === "assistant") &&
            typeof item.content === "string"
        );

        if (conversation.length === 0) return;

        conversation.forEach(item => {
            addMessage(item.role, item.content);
        });

    } catch (error) {
        console.error("Ошибка восстановления чата:", error);
    }
}

input.addEventListener("input", () => {
    input.style.height = "42px";
    input.style.height = Math.min(input.scrollHeight, 150) + "px";
});

input.addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
    }
});

restoreChat();
</script>

</body>
</html>
